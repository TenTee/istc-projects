[pytest]
DJANGO_SETTINGS_MODULE = smart_back.settings
python_files = tests.py test_*.py *_tests.py
# Dossiers à ne pas parcourir (dépendances, fichiers envoyés, environnement virtuel)
norecursedirs = venv .venv media protected_files staticfiles node_modules .git
# Sortie lisible et arrêt propre sur les avertissements de dépréciation de Django uniquement
addopts = -ra
